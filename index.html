<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文考前複習中心</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#203353;background:#f4f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 9%,#dceaff 0,transparent 35%),radial-gradient(circle at 90% 24%,#f9dff7 0,transparent 30%),#f5f8ff}.wrap{max-width:1060px;margin:auto;padding:52px 22px 70px}.hero{text-align:center;margin:25px auto 48px}.hero h1{font-size:clamp(36px,6vw,62px);letter-spacing:.04em;line-height:1.2;margin:0 0 19px;color:#253f91;font-weight:900}.hero p{font-size:clamp(18px,2.7vw,25px);margin:0;color:#526581;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{background:white;border:1px solid #e2eafa;border-radius:27px;box-shadow:0 13px 34px #24457b13;padding:30px;display:flex;flex-direction:column;min-height:310px;position:relative;overflow:hidden}.card:before{content:'';position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#4585ff,#89c7fa)}.card.grammar:before{background:linear-gradient(90deg,#c78ef0,#eea8cd)}.symbol{font-size:48px;line-height:1;margin:13px 0 19px}.card h2{font-size:clamp(23px,3vw,31px);margin:0 0 13px}.card p{font-size:18px;line-height:1.8;color:#5d6b83;margin:0 0 25px}.actions{margin-top:auto}.btn{display:inline-block;border-radius:14px;background:#325fcf;padding:14px 23px;color:white;text-decoration:none;font-size:18px;font-weight:700}.btn:hover,.btn:focus-visible{background:#204ebc;outline-offset:3px}.soon{display:inline-block;background:#f3e9fa;color:#815b9a;padding:13px 20px;border-radius:13px;font-weight:700;font-size:17px}.foot{text-align:center;margin-top:38px;font-size:15px;color:#70809d}@media(max-width:700px){.wrap{padding-top:35px}.hero{margin:15px auto 35px}.grid{grid-template-columns:1fr}.card{min-height:265px;padding:25px}.card p{font-size:17px}}
</style>
</head>
<body><main class="wrap"><header class="hero"><h1>英文考前複習中心</h1><p>選擇你的複習主題，開始練習！</p></header><section class="grid" aria-label="複習主題"><article class="card"><div class="symbol" aria-hidden="true">📚</div><h2>期中考單字複習（U4–U6）</h2><p>單字配對、課本例句填空與單字總覽，依自己的進度反覆複習。</p><div class="actions"><a class="btn" href="./vocabulary/">開始單字複習 →</a></div></article><article class="card grammar"><div class="symbol" aria-hidden="true">📝</div><h2>期中考句型複習（句型 11–20）</h2><p>選擇題、填空式翻譯與句子重組，依課本句型練習並查看解析。</p><div class="actions"><a class="btn" href="./grammar/">開始句型複習 →</a></div></article></section><div class="foot">選擇上方的複習主題，開始你的學習旅程。</div></main></body>
</html>
