const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let range='all',count=10,session=[],pos=0,state={},answered=false,active=false;
function renderChoices(){ $('ranges').innerHTML=[['a','句型 11–15'],['b','句型 16–20'],['all','全部 11–20']].map(([v,t])=>`<button class="tile ${range===v?'active':''}" data-range="${v}">${t}</button>`).join('');$('counts').innerHTML=[10,15,20].map(x=>`<button class="tile ${count===x?'active':''}" data-count="${x}">${x} 題</button>`).join('');document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;renderChoices()});document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;renderChoices()})}renderChoices();
const sections=['setup','quiz','done'];function show(s){sections.forEach(k=>$(k).classList.toggle('hide',k!==s));window.scrollTo({top:0,behavior:'instant'})}
function start(){const allowed=BANK.filter(q=>range==='all'||(range==='a'?q.unit<=15:q.unit>=16));let samples=[];for(const [type,k] of [['mc',count/2],['fill',count/4],['reorder',count/4]]){let n=type==='mc'?Math.round(k):Math.floor(k);samples.push(...shuffle(allowed.filter(x=>x.type===type)).slice(0,n))}while(samples.length<count){let rem=shuffle(allowed.filter(q=>!samples.includes(q)));if(!rem.length)break;samples.push(rem[0])}session=shuffle(samples.slice(0,count));pos=0;active=true;display()}
$('start').onclick=start;
function display(){if(pos>=session.length){$('finished').textContent=session.length;active=false;show('done');return}answered=false;state={selected:null,vals:[],pieces:[],choices:[]};let q=session[pos];$('counter').textContent=`第 ${pos+1} / ${session.length} 題`;$('bar').style.width=`${100*pos/session.length}%`;$('qtag').textContent=`句型 ${q.unit}｜${{mc:'四選一選擇題',fill:'填空式翻譯',reorder:'整句翻譯'}[q.type]}`;$('feedback').classList.add('hide');$('next').classList.add('hide');$('submit').classList.remove('hide');$('reset').classList.remove('hide');renderQ();show('quiz')}
function buildStem(text,htmlParts){let chunks=text.split(/___/);return chunks.map((x,i)=>escapeHTML(x)+(htmlParts[i]||'')).join('')}
function renderQ(){let q=session[pos],html='';if(q.cn)html+=`<div class="cn">${escapeHTML(q.cn)}</div>`;
if(q.type==='mc'){if(!state.choices.length)state.choices=shuffle(q.options.map((t,i)=>({t,i})));html+=`<div class="question" style="margin-top:16px">${escapeHTML(q.prompt)}</div><div class="answers">`+state.choices.map((o,i)=>`<button class="ans ${state.selected===o.i?'chosen':''}" data-ans="${o.i}">${String.fromCharCode(65+i)}. ${escapeHTML(o.t)}</button>`).join('')+'</div>'}
if(q.type==='fill'){if(!state.choices.length)state.choices=q.choices.map(c=>shuffle(c));html+=`<div class="question fillline">${buildStem(q.prompt,q.fills.map((f,i)=>`<select class="fillselect" data-fill="${i}"><option value="">選擇答案 ▾</option>${state.choices[i].map((c,j)=>`<option value="${j}" ${state.vals[i]===j?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select>`))}</div>`}
if(q.type==='reorder'){if(!state.choices.length)state.choices=shuffle(q.chunks.map((text,i)=>({text,i})));html+=`<div class="question" style="margin-top:12px">${escapeHTML(q.prompt)}</div><p class="description">點選下方詞組，依序組成正確英文；已選詞組可點擊撤回。</p><div class="sentencebox">${state.pieces.length?state.pieces.map((p,k)=>`<button class="word" data-pop="${k}">${escapeHTML(q.chunks[p])} ×</button>`).join(' '):'<span class="description">請開始選擇詞組……</span>'}</div><div class="wordbank">${state.choices.filter(x=>!state.pieces.includes(x.i)).map(x=>`<button class="word" data-piece="${x.i}">${escapeHTML(x.text)}</button>`).join('')}</div>`}
$('qbody').innerHTML=html;wire(q)}
function wire(q){document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.ans;renderQ()});document.querySelectorAll('[data-fill]').forEach(s=>s.onchange=()=>{state.vals[+s.dataset.fill]=s.value===''?null:+s.value});document.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{state.pieces.push(+b.dataset.piece);renderQ()});document.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>{state.pieces.splice(+b.dataset.pop,1);renderQ()})}
function explain(q,ok){let a=q.type==='mc'?q.options[q.answer]:q.type==='fill'?q.fills.join(' / '):q.solution;let details='';if(q.type==='mc'){details='<p><b>四個選項逐一解析</b></p><ol class="mc-explain">'+q.options.map((o,i)=>`<li>${escapeHTML(o)}：${i===q.answer?'正確，符合本題的句型結構與語意。':'不適合本題的句型結構、詞類或語意；須與正確答案比較。'}</li>`).join('')+'</ol>'}else if(q.type==='fill')details='<p>填空時要注意空格前後的文法、比較級或假設語氣的時態搭配；解答依課本正式解答本。</p>';else details='<p>重組時先找主詞與動詞，再組合比較結構、條件子句或修飾語。注意片語順序及句末標點。</p>';return `<h3>${ok?'✅ 這題答對了！':'📘 參考答案與解析'}</h3><p><b>正確答案：</b>${escapeHTML(a)}</p>${q.cn?`<p><b>中文題目：</b>${escapeHTML(q.cn)}</p>`:''}<p><b>句型重點：</b>${escapeHTML(q.concept)}</p>${q.cue?`<p><b>解題提醒：</b>${escapeHTML(q.cue)}</p>`:''}${details}<p class="subtle">${escapeHTML(q.source)}</p>`}
$('submit').onclick=()=>{if(answered)return;let q=session[pos];if(q.type==='mc'&&state.selected===null)return alert('請選擇一個答案');if(q.type==='fill'&&q.fills.some((x,i)=>state.vals[i]==null))return alert('請完成所有空格');if(q.type==='reorder'&&state.pieces.length!==q.chunks.length)return alert('請使用所有詞組完成重組');let ok=q.type==='mc'?state.selected===q.answer:q.type==='fill'?q.fills.every((a,i)=>state.choices[i][state.vals[i]]===a):q.chunks.every((c,i)=>state.pieces[i]===i);answered=true;$('feedback').innerHTML=explain(q,ok);$('feedback').classList.remove('hide');$('submit').classList.add('hide');$('reset').classList.add('hide');$('next').classList.remove('hide');$('next').textContent=pos===session.length-1?'查看完成畫面 →':'下一題 →';document.querySelectorAll('.ans,.word,.fillselect').forEach(el=>el.disabled=true);$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};
$('next').onclick=()=>{pos++;display()};$('reset').onclick=()=>{state={selected:null,vals:[],pieces:[],choices:[]};renderQ()};$('again').onclick=start;
function home(){if(active){$('overlay').classList.remove('hide')}else{show('setup')}}$('homebtn').onclick=home;$('endhome').onclick=()=>show('setup');$('cancel').onclick=()=>{$('overlay').classList.add('hide')};$('confirmhome').onclick=()=>{active=false;$('overlay').classList.add('hide');show('setup')};
</script></body></html>
