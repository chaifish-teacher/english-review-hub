 app.querySelectorAll('[data-answer-index]').forEach(e=>e.onclick=()=>submitSentence(sentenceOptions[Number(e.dataset.answerIndex)]));
}
function endResults(){let correct=results.filter(r=>r.correct).length,total=picked.length,percentage=total?Math.round(correct/total*100):0,errors=results.filter(r=>!r.correct);app.innerHTML=`<div class="panel resultsHero"><span class="tag">🎉 ${settings.mode==='match'?'單字配對':'例句填空題'}已完成</span><h2 style="margin-top:14px">本次學習成果</h2><div class="grid"><div class="stat"><strong>${correct} / ${total}</strong><span>答對題數</span></div><div class="stat"><strong>${percentage}%</strong><span>整體正確率</span></div></div><div class="buttonRow"><button class="btn primary" id="again">🔄 再挑戰一次</button><button class="btn" id="goHome">⌂ 回首頁</button></div></div><div class="panel"><h2>錯題與解析（${errors.length} 題）</h2>${errors.length?errors.map((r,i)=>`<div class="review"><span class="tag">${r.stage==='match'?'單字配對':'例句填空題'} · Unit ${r.item.unit}</span><h3>${i+1}. ${esc(r.item.word)}</h3>${r.stage==='sentence'?`<div class="question">${esc(r.item.cloze)}</div>`:''}<p><b>你的答案：</b>${esc(r.given)}</p><p><b>正確答案：</b>${esc(r.item.word)} — ${esc(r.item.meaning)}${r.stage==='sentence'?`（填入：${esc(r.item.blank)}）`:''}</p><p><b>課本例句：</b>${esc(r.item.sentence)}</p><div class="translation">${esc(r.item.translation)}</div><p class="muted small">解析：${r.stage==='match'?'請將英文單字與其課本中文意思配對。':`依例句上下文選擇符合「${esc(r.item.meaning)}」的答案。課本用法：${esc(r.item.blank)}。`}</p></div>`).join(''):'<p>🎉 全部答對！沒有需要檢討的錯題。</p>'}</div>`;document.getElementById('again').onclick=start;document.getElementById('goHome').onclick=backHome}
function overview(){let items=BANK.filter(x=>overviewUnits.includes(x.unit));app.innerHTML=`<div class="panel"><h2>單字總覽</h2><p class="muted">僅收錄課本每個正式編號的首個主要單字及正式片語，不包含延伸詞。共 ${BANK.length} 項。</p><div class="flex">${[4,5,6].map(u=>`<label class="check"><input type="checkbox" data-filter="${u}" ${overviewUnits.includes(u)?'checked':''}> Unit ${u}</label>`).join('')}</div><p class="muted small">目前顯示 ${items.length} 項。可點選按鈕朗讀單字或原句。</p>${items.map(x=>`<div class="vocabitem"><span class="tag">Unit ${x.unit} · ${x.kind==='idiom'?'片語':'單字'} ${x.num}</span><div class="english">${esc(x.word)} <button class="btn audio" data-word-speak="${esc(x.word)}">🔊 單字</button></div><p>${esc(x.meaning)}</p><p>${esc(x.sentence)} <button class="btn audio" data-sentence-speak="${esc(x.sentence)}">🔊 例句</button></p><p class="muted">${esc(x.translation)}</p></div>`).join('')}<div class="buttonRow"><button class="btn" id="closeOverview">回首頁</button></div></div>`;app.querySelectorAll('[data-filter]').forEach(e=>e.onchange=()=>{let u=+e.dataset.filter;if(!e.checked&&overviewUnits.length===1){e.checked=true;toast('請至少選一課');return}overviewUnits=e.checked?[...overviewUnits,u]:overviewUnits.filter(x=>x!==u);overviewUnits.sort();overview()});app.querySelectorAll('[data-word-speak]').forEach(e=>e.onclick=()=>speak(e.dataset.wordSpeak));app.querySelectorAll('[data-sentence-speak]').forEach(e=>e.onclick=()=>speak(e.dataset.sentenceSpeak));document.getElementById('closeOverview').onclick=backHome}
render();
</script></body></html>
